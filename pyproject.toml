[tool.uv]
package = true

[project]
name = "kin"
version = "0.1.0"
description = "A distributed, durable agent orchestration system."
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "temporalio",
    "redis",
    "pydantic",
    "pydantic-settings",
    "anthropic",
    "qdrant-client",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "loguru",
    "duckduckgo-search>=8.1.1",
    "google-generativeai>=0.8.6",
    "google-genai>=1.73.1",
    "typer>=0.12.0",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "groq>=1.2.0",
    "ddgs>=9.14.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[project.scripts]
kin = "kin.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "flake8",
    "black",
    "mypy",
]