[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kin"
version = "0.1.0"
dependencies = [
    "fastapi",
    "uvicorn",
    "temporalio",
    "redis",
    "pydantic",
    "pydantic-settings",
    "anthropic",
    "qdrant-client",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "loguru",
    "duckduckgo-search>=8.1.1",
    "google-generativeai>=0.8.6",
    "google-genai>=1.73.1",
    "typer>=0.25.0",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "groq>=1.2.0",
    "ddgs>=9.14.1",
]

[tool.setuptools.packages.find]
where = ["."]
